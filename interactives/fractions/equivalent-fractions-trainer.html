<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equivalent Fractions Trainer</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-accent: #4ECDC4;
            --bg-cream: #FFF8F0;
            --text-dark: #2D3436;
            --text-light: #636E72;
            --card-shadow: 0 8px 32px rgba(0,0,0,0.12);
            --level1-color: #4ECDC4;
            --level2-color: #3498DB;
            --level3-color: #FF6B6B;
            --level4-color: #9B5DE5;
            --correct-color: #27AE60;
            --incorrect-color: #E74C3C;
            --blue: #3498DB;
            --amber: #FFD93D;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Fredoka', sans-serif;
            background: var(--bg-cream);
            color: var(--text-dark);
            min-height: 100vh;
            padding: 1.5rem 1rem 3rem;
        }

        .page-header { text-align: center; max-width: 760px; margin: 0 auto 0.5rem; }

        .page-header h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 700; }

        .page-header p {
            color: var(--text-light);
            font-size: clamp(0.95rem, 2.5vw, 1.05rem);
            margin-top: 0.3rem;
        }

        /* ---------- Level tabs ---------- */
        .level-tabs {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 0.6rem;
            max-width: 760px;
            margin: 1.5rem auto 0;
        }

        .level-tab {
            flex: 1 1 160px;
            max-width: 220px;
            background: white;
            border: 3px solid #dfe6e9;
            border-radius: 16px;
            padding: 0.6rem 0.8rem;
            font-family: 'Fredoka', sans-serif;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px rgba(0,0,0,0.06);
        }

        .level-tab h3 { font-size: 1rem; font-weight: 700; }
        .level-tab p { font-size: 0.8rem; color: var(--text-light); margin-top: 0.1rem; }
        .level-tab:hover { transform: translateY(-2px); }

        .level-tab.active.tab-l1 { border-color: var(--level1-color); background: #e8f8f5; }
        .level-tab.active.tab-l2 { border-color: var(--level2-color); background: #e9f4fc; }
        .level-tab.active.tab-l3 { border-color: var(--level3-color); background: #fdeeee; }
        .level-tab.active.tab-l4 { border-color: var(--level4-color); background: #f4ecfd; }

        /* ---------- Score bar ---------- */
        .score-card {
            background: white;
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            border-top: 5px solid var(--amber);
            margin: 1.5rem auto;
            max-width: 760px;
            padding: 1.1rem 1.5rem;
        }

        .score-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .score-label { font-weight: 600; font-size: 1.05rem; }

        .score-value {
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            font-size: 1.3rem;
        }

        .score-time {
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text-light);
        }

        .score-time::before {
            content: 'Time ';
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            color: var(--text-dark);
        }

        .score-goal-msg {
            font-weight: 600;
            color: var(--correct-color);
            font-size: 0.95rem;
            display: none;
        }

        .progress-track {
            margin-top: 0.8rem;
            height: 14px;
            background: #f1f5f9;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--level1-color), #38b2aa);
            border-radius: 10px;
            transition: width 0.4s ease;
        }

        .progress-fill.l2 { background: linear-gradient(90deg, var(--level2-color), #2176ae); }
        .progress-fill.l3 { background: linear-gradient(90deg, var(--level3-color), #e05252); }
        .progress-fill.l4 { background: linear-gradient(90deg, var(--level4-color), #7c3aed); }

        .milestone-tick {
            position: absolute;
            top: 0; bottom: 0;
            width: 3px;
            background: rgba(45,52,54,0.25);
            z-index: 1;
        }

        .milestone-labels {
            position: relative;
            height: 1.1rem;
            margin-top: 0.15rem;
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            font-size: 0.75rem;
            color: var(--text-light);
        }

        .milestone-labels span { position: absolute; transform: translateX(-50%); }

        /* ---------- Question card ---------- */
        .question-card {
            background: white;
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            border-top: 5px solid var(--level1-color);
            margin: 1.5rem auto;
            max-width: 760px;
            padding: 2rem 1.5rem;
            transition: border-color 0.3s ease;
        }

        .question-card.l2 { border-top-color: var(--level2-color); }
        .question-card.l3 { border-top-color: var(--level3-color); }
        .question-card.l4 { border-top-color: var(--level4-color); }

        .question-instruction {
            text-align: center;
            color: var(--text-light);
            font-size: 1rem;
            margin-bottom: 1.4rem;
        }

        .fraction-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: clamp(0.4rem, 2vw, 1rem);
            flex-wrap: wrap;
            animation: fadeIn 0.4s ease;
        }

        .frac {
            display: inline-flex;
            align-items: flex-end;
            gap: 5px;
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            font-size: clamp(1.4rem, 4vw, 1.9rem);
        }

        .frac-stack { display: flex; flex-direction: column; align-items: center; }

        .frac .num { padding: 0 0.5rem 0.15rem; }

        .frac .den {
            padding: 0.15rem 0.5rem 0;
            border-top: 3px solid var(--text-dark);
        }

        .mult-chip {
            display: none;
            font-size: 0.55em;
            background: #eaf4fb;
            color: var(--blue);
            border-radius: 8px;
            padding: 0.1em 0.45em;
            margin-bottom: 0.15em;
            white-space: nowrap;
        }

        .mult-chip.visible { display: inline-block; animation: popIn 0.35s ease; }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.5); }
            70% { transform: scale(1.15); }
            100% { opacity: 1; transform: scale(1); }
        }

        .op {
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            font-size: clamp(1.3rem, 3.5vw, 1.7rem);
        }

        .input-frac { display: inline-flex; flex-direction: column; align-items: center; }

        .input-frac input, .simp-divisor {
            width: 74px;
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            font-size: clamp(1.2rem, 3.5vw, 1.6rem);
            text-align: center;
            border: 3px solid #dfe6e9;
            border-radius: 12px;
            padding: 0.3rem 0.2rem;
            color: var(--text-dark);
            background: white;
            outline: none;
            transition: border-color 0.2s ease, background 0.2s ease;
            -moz-appearance: textfield;
            appearance: textfield;
        }

        .input-frac input::-webkit-outer-spin-button,
        .input-frac input::-webkit-inner-spin-button,
        .simp-divisor::-webkit-outer-spin-button,
        .simp-divisor::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .input-frac input:focus, .simp-divisor:focus { border-color: var(--primary-accent); }

        .input-frac input:disabled, .simp-divisor:disabled {
            background: #f1f5f9;
            border-color: #e8edf0;
            cursor: not-allowed;
        }

        .input-frac .frac-bar {
            width: 74px;
            height: 3px;
            background: var(--text-dark);
            margin: 0.35rem 0;
            border-radius: 2px;
        }

        .input-frac input.correct, .simp-divisor.correct {
            border-color: var(--correct-color);
            background: #eafaf1;
            color: var(--correct-color);
        }

        .input-frac input.wrong, .simp-divisor.wrong {
            border-color: var(--incorrect-color);
            background: #fdecea;
            color: var(--incorrect-color);
            animation: shake 0.35s ease;
        }

        .sum-group { display: none; align-items: center; gap: clamp(0.4rem, 2vw, 1rem); }
        .sum-group.visible { display: flex; }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ---------- Simplify area ---------- */
        .simplify-area { display: none; }
        .simplify-area.visible { display: block; }

        .simp-start {
            display: flex;
            justify-content: center;
            margin-bottom: 0.4rem;
            animation: fadeIn 0.4s ease;
        }

        .simp-steps { display: flex; flex-direction: column; align-items: center; gap: 0.9rem; }

        .simp-step {
            display: flex;
            align-items: center;
            gap: clamp(0.4rem, 2vw, 0.9rem);
            flex-wrap: wrap;
            justify-content: center;
            animation: fadeIn 0.4s ease;
        }

        .simp-divisor { width: 62px; }

        .simp-divide-label {
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            font-size: clamp(1.1rem, 3vw, 1.4rem);
            color: var(--text-light);
        }

        .simp-done-flag {
            display: inline-block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--correct-color);
            background: #eafaf1;
            border-radius: 8px;
            padding: 0.2rem 0.6rem;
        }

        /* ---------- Feedback + hint ---------- */
        .feedback-box {
            display: none;
            margin: 1.4rem auto 0;
            max-width: 580px;
            border-radius: 12px;
            padding: 0.9rem 1.1rem;
            font-size: 0.95rem;
            line-height: 1.6;
            animation: fadeIn 0.3s ease;
        }

        .feedback-box.visible { display: block; }

        .feedback-box.fb-wrong { background: #fdecea; border-left: 4px solid var(--incorrect-color); }
        .feedback-box.fb-progress { background: #eafaf1; border-left: 4px solid var(--correct-color); }
        .feedback-box.fb-partial { background: #fff8e6; border-left: 4px solid var(--amber); }
        .feedback-box.fb-success { background: #eafaf1; border-left: 4px solid var(--correct-color); font-weight: 600; }

        .mono { font-family: 'Space Mono', monospace; font-weight: 700; }

        .question-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .hint-btn {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: none;
            background: var(--blue);
            color: white;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(52,152,219,0.3);
        }

        .hint-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(52,152,219,0.4); }

        .next-btn {
            display: none;
            background: var(--primary-accent);
            color: white;
            border: none;
            border-radius: 30px;
            padding: 0.7rem 1.8rem;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(78,205,196,0.35);
        }

        .next-btn.visible { display: inline-block; }
        .next-btn:hover { transform: translateY(-2px); }

        .hint-box {
            display: none;
            margin: 1.2rem auto 0;
            max-width: 580px;
            background: #eaf4fb;
            border-left: 4px solid var(--blue);
            border-radius: 12px;
            padding: 0.9rem 1.1rem;
            font-size: 0.95rem;
            line-height: 1.7;
            animation: fadeIn 0.3s ease;
        }

        .hint-box.visible { display: block; }

        /* ---------- Goal celebration ---------- */
        .goal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(45,52,54,0.55);
            z-index: 50;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .goal-overlay.visible { display: flex; }

        .goal-modal {
            background: white;
            border-radius: 20px;
            border-top: 5px solid var(--amber);
            box-shadow: var(--card-shadow);
            max-width: 440px;
            width: 100%;
            padding: 2rem 1.7rem;
            text-align: center;
            animation: fadeIn 0.4s ease;
        }

        .goal-modal h2 { font-size: 1.5rem; margin-bottom: 0.6rem; }
        .goal-modal p { color: var(--text-light); line-height: 1.6; margin-bottom: 1.3rem; }

        .goal-modal button {
            background: var(--primary-accent);
            color: white;
            border: none;
            border-radius: 30px;
            padding: 0.7rem 1.6rem;
            font-family: 'Fredoka', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin: 0.25rem;
            transition: all 0.3s ease;
        }

        .goal-modal button:hover { transform: translateY(-2px); }

        @media (max-width: 600px) {
            .input-frac input { width: 58px; }
            .input-frac .frac-bar { width: 58px; }
            .simp-divisor { width: 52px; }
            .question-card { padding: 1.5rem 0.9rem; }
            .level-tab { flex: 1 1 130px; }
            .level-tab h3 { font-size: 0.9rem; }
            .level-tab p { font-size: 0.72rem; }
        }
    </style>
</head>
<body>

    <div class="page-header">
        <h1>Equivalent Fractions Trainer</h1>
        <p id="levelBlurb">Give both fractions the same denominator.</p>
    </div>

    <div class="level-tabs">
        <button class="level-tab tab-l1 active" id="tab-l1" onclick="setLevel(1)">
            <h3>Level 1</h3>
            <p>Convert, with clues</p>
        </button>
        <button class="level-tab tab-l2" id="tab-l2" onclick="setLevel(2)">
            <h3>Level 2</h3>
            <p>Convert on your own</p>
        </button>
        <button class="level-tab tab-l3" id="tab-l3" onclick="setLevel(3)">
            <h3>Level 3</h3>
            <p>Add and subtract</p>
        </button>
        <button class="level-tab tab-l4" id="tab-l4" onclick="setLevel(4)">
            <h3>Level 4</h3>
            <p>Simplify</p>
        </button>
    </div>

    <div class="score-card">
        <div class="score-row">
            <span class="score-label" id="scoreLabel">Level 1 Score</span>
            <span class="score-goal-msg" id="goalMsg">Goal reached! Keep going.</span>
            <span class="score-time" id="scoreTime">0:00</span>
            <span class="score-value"><span id="scoreCount">0</span> / <span id="scoreTarget">20</span></span>
        </div>
        <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
            <div class="milestone-tick" style="left: 40%;"></div>
            <div class="milestone-tick" style="left: 70%;"></div>
        </div>
        <div class="milestone-labels">
            <span style="left: 40%;">20</span>
            <span style="left: 70%;">35</span>
            <span style="left: 100%; transform: translateX(-100%);">50</span>
        </div>
    </div>

    <div class="question-card" id="questionCard">
        <p class="question-instruction" id="instruction">First, give both fractions the same denominator. Press Enter after each box.</p>

        <div class="fraction-row" id="convertArea">
            <div class="frac">
                <div class="frac-stack">
                    <span class="num" id="q-num1"></span>
                    <span class="den" id="q-den1"></span>
                </div>
                <span class="mult-chip" id="mult1"></span>
            </div>
            <span class="op" id="q-op1">+</span>
            <div class="frac">
                <div class="frac-stack">
                    <span class="num" id="q-num2"></span>
                    <span class="den" id="q-den2"></span>
                </div>
                <span class="mult-chip" id="mult2"></span>
            </div>
            <span class="op">=</span>
            <div class="input-frac">
                <input type="number" id="in-num1" inputmode="numeric" aria-label="First numerator" disabled>
                <div class="frac-bar"></div>
                <input type="number" id="in-den1" inputmode="numeric" aria-label="First denominator">
            </div>
            <span class="op" id="q-op2">+</span>
            <div class="input-frac">
                <input type="number" id="in-num2" inputmode="numeric" aria-label="Second numerator" disabled>
                <div class="frac-bar"></div>
                <input type="number" id="in-den2" inputmode="numeric" aria-label="Second denominator">
            </div>
            <div class="sum-group" id="sumGroup">
                <span class="op">=</span>
                <div class="input-frac">
                    <input type="number" id="in-sum-num" inputmode="numeric" aria-label="Answer numerator" disabled>
                    <div class="frac-bar"></div>
                    <input type="number" id="in-sum-den" inputmode="numeric" aria-label="Answer denominator" disabled>
                </div>
            </div>
        </div>

        <div class="simplify-area" id="simplifyArea">
            <div class="simp-start">
                <div class="frac">
                    <div class="frac-stack">
                        <span class="num" id="s-num"></span>
                        <span class="den" id="s-den"></span>
                    </div>
                </div>
            </div>
            <div class="simp-steps" id="simpSteps"></div>
        </div>

        <div class="feedback-box" id="feedbackBox"></div>
        <div class="hint-box" id="hintBox"></div>

        <div class="question-controls">
            <button class="hint-btn" id="hintBtn" onclick="showHint()" title="Show a hint">?</button>
            <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Next question</button>
        </div>
    </div>

    <div class="goal-overlay" id="goalOverlay">
        <div class="goal-modal">
            <h2 id="goalTitle">50 correct. You did it!</h2>
            <p id="goalText"></p>
            <span id="goalButtons"></span>
        </div>
    </div>

    <script>
        /* ---------- Utilities ---------- */
        function gcd(a, b) { return b ? gcd(b, a % b) : a; }
        function lcm(a, b) { return a * b / gcd(a, b); }
        function randPick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
        function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }
        function mono(n) { return '<span class="mono">' + n + '</span>'; }
        function factorsOf(n) {
            var out = [];
            for (var i = 1; i <= n; i++) if (n % i === 0) out.push(i);
            return out;
        }

        var MILESTONES = [20, 35, 50];

        /* Denominator pairs for levels 1 to 3. LCD is always 24 or less. */
        var DEN_PAIRS = [
            [2,4],[2,6],[2,8],[2,10],[2,12],[3,6],[3,9],[3,12],[4,8],[4,12],[5,10],[6,12],
            [2,3],[2,5],[2,9],[3,4],[3,5],[3,8],[4,5],
            [4,6],[6,8],[6,9],[4,10],[8,12]
        ];

        /* Simplest-form fractions used as the target for level 4 */
        var SIMPLE_BASES = [
            [1,2],[1,3],[2,3],[1,4],[3,4],[1,5],[2,5],[3,5],[4,5],
            [1,6],[5,6],[1,7],[2,7],[3,7],[1,8],[3,8],[5,8],[2,9],[4,9],[1,10],[3,10],[5,12]
        ];
        var SIMPLE_MULTS = [2,3,4,4,5,6,6,8,9,2,3,4,6];

        var state = {
            q: null,
            level: 1,
            scores: { 1:0, 2:0, 3:0, 4:0 },
            goal: 50,
            goalReached: { 1:false, 2:false, 3:false, 4:false },
            lastKey: '',
            simp: null,
            timing: {
                1: { totalMs:0, runningSince:null, splits:{} },
                2: { totalMs:0, runningSince:null, splits:{} },
                3: { totalMs:0, runningSince:null, splits:{} },
                4: { totalMs:0, runningSince:null, splits:{} }
            }
        };

        /* ---------- Timer ---------- */
        function elapsedMs(level) {
            var t = state.timing[level];
            return t.totalMs + (t.runningSince ? Date.now() - t.runningSince : 0);
        }

        function startTimerIfNeeded() {
            var t = state.timing[state.level];
            if (t.runningSince === null && !state.goalReached[state.level]) t.runningSince = Date.now();
        }

        function pauseTimer(level) {
            var t = state.timing[level];
            if (t.runningSince !== null) {
                t.totalMs += Date.now() - t.runningSince;
                t.runningSince = null;
            }
        }

        function formatTime(ms) {
            var totalSec = Math.floor(ms / 1000);
            var m = Math.floor(totalSec / 60);
            var s = totalSec % 60;
            return m + ':' + (s < 10 ? '0' : '') + s;
        }

        function updateTimeDisplay() {
            document.getElementById('scoreTime').textContent = formatTime(elapsedMs(state.level));
        }

        setInterval(updateTimeDisplay, 500);

        /* ---------- Question generation ---------- */
        function makeConvertQuestion() {
            var pair, key, combos, tries = 0;
            do {
                pair = randPick(DEN_PAIRS).slice();
                if (Math.random() < 0.5) pair.reverse();
                key = pair[0] + '-' + pair[1];
                /* Every numerator pairing whose two fractions are not equal in value */
                combos = [];
                for (var a = 1; a < pair[0]; a++) {
                    for (var b = 1; b < pair[1]; b++) {
                        if (a * pair[1] !== b * pair[0]) combos.push([a, b]);
                    }
                }
                tries++;
            } while ((combos.length === 0 || key === state.lastKey) && tries < 12);
            if (!combos.length) { pair = [3, 4]; combos = [[1, 3]]; key = '3-4'; }
            state.lastKey = key;

            var d1 = pair[0], d2 = pair[1];
            var L = lcm(d1, d2);
            var chosen = randPick(combos);
            var n1 = chosen[0], n2 = chosen[1];

            var op = '+';
            if (state.level === 3) {
                op = Math.random() < 0.5 ? '+' : '-';
                if (op === '-') {
                    /* Keep the answer positive: the first fraction must be the larger one */
                    if (n1 * d2 < n2 * d1) {
                        var tn = n1, td = d1;
                        n1 = n2; d1 = d2; n2 = tn; d2 = td;
                    }
                }
            }

            var t1 = n1 * (L / d1), t2 = n2 * (L / d2);
            return {
                kind: 'convert',
                n1: n1, d1: d1, n2: n2, d2: d2, L: L,
                m1: L / d1, m2: L / d2,
                t1: t1, t2: t2,
                op: op,
                answer: op === '+' ? t1 + t2 : t1 - t2
            };
        }

        function makeSimplifyQuestion() {
            var base, k, n, d, key, tries = 0;
            do {
                base = randPick(SIMPLE_BASES);
                k = randPick(SIMPLE_MULTS);
                n = base[0] * k;
                d = base[1] * k;
                key = n + '-' + d;
                tries++;
            } while ((d > 72 || key === state.lastKey) && tries < 25);
            state.lastKey = key;
            return { kind: 'simplify', n0: n, d0: d, sn: base[0], sd: base[1], hcf: k };
        }

        function makeQuestion() {
            return state.level === 4 ? makeSimplifyQuestion() : makeConvertQuestion();
        }

        /* ---------- Element handles ---------- */
        var inputs = {
            num1: document.getElementById('in-num1'),
            den1: document.getElementById('in-den1'),
            num2: document.getElementById('in-num2'),
            den2: document.getElementById('in-den2'),
            sumNum: document.getElementById('in-sum-num'),
            sumDen: document.getElementById('in-sum-den')
        };

        var LEVEL_BLURB = {
            1: 'Give both fractions the same denominator. The clues show what happened to each denominator.',
            2: 'Give both fractions the same denominator. No clues this time.',
            3: 'Convert both fractions, then add or subtract them.',
            4: 'Divide the top and the bottom by the same number until the fraction is as simple as it can be.'
        };

        /* ---------- Rendering ---------- */
        function renderQuestion() {
            var q = state.q;
            hideFeedback();
            hideHint();
            document.getElementById('nextBtn').classList.remove('visible');

            var isSimplify = (q.kind === 'simplify');
            document.getElementById('convertArea').style.display = isSimplify ? 'none' : 'flex';
            document.getElementById('simplifyArea').classList.toggle('visible', isSimplify);

            if (isSimplify) {
                renderSimplifyQuestion();
            } else {
                renderConvertQuestion();
            }
        }

        function renderConvertQuestion() {
            var q = state.q;
            document.getElementById('q-num1').textContent = q.n1;
            document.getElementById('q-den1').textContent = q.d1;
            document.getElementById('q-num2').textContent = q.n2;
            document.getElementById('q-den2').textContent = q.d2;
            document.getElementById('q-op1').textContent = q.op;
            document.getElementById('q-op2').textContent = q.op;

            for (var k in inputs) {
                inputs[k].value = '';
                inputs[k].classList.remove('correct', 'wrong');
                inputs[k].readOnly = false;
                inputs[k].disabled = true;
            }
            inputs.den1.disabled = false;
            inputs.den2.disabled = false;

            ['mult1', 'mult2'].forEach(function (id) {
                var chip = document.getElementById(id);
                chip.classList.remove('visible');
                chip.textContent = '';
            });

            document.getElementById('sumGroup').classList.toggle('visible', state.level === 3);
            document.getElementById('instruction').textContent = 'First, give both fractions the same denominator. Press Enter after each box.';
            inputs.den1.focus();
        }

        function renderSimplifyQuestion() {
            var q = state.q;
            document.getElementById('s-num').textContent = q.n0;
            document.getElementById('s-den').textContent = q.d0;
            document.getElementById('simpSteps').innerHTML = '';
            state.simp = { curN: q.n0, curD: q.d0, stepCount: 0 };
            document.getElementById('instruction').textContent = 'What number goes into both the top and the bottom? Divide by it.';
            addSimplifyStep();
        }

        function addSimplifyStep() {
            var i = state.simp.stepCount;
            var wrap = document.createElement('div');
            wrap.className = 'simp-step';
            wrap.id = 'simp-step-' + i;
            wrap.innerHTML =
                '<span class="simp-divide-label">divide by</span>' +
                '<input type="number" class="simp-divisor" id="simp-div-' + i + '" inputmode="numeric" aria-label="Divide by">' +
                '<span class="op">=</span>' +
                '<div class="input-frac">' +
                    '<input type="number" id="simp-num-' + i + '" inputmode="numeric" aria-label="New numerator" disabled>' +
                    '<div class="frac-bar"></div>' +
                    '<input type="number" id="simp-den-' + i + '" inputmode="numeric" aria-label="New denominator" disabled>' +
                '</div>';
            document.getElementById('simpSteps').appendChild(wrap);

            ['div', 'num', 'den'].forEach(function (part) {
                attachInput(document.getElementById('simp-' + part + '-' + i), 'simp:' + part + ':' + i);
            });
            document.getElementById('simp-div-' + i).focus();
        }

        function nextQuestion() {
            state.q = makeQuestion();
            renderQuestion();
        }

        function setLevel(level) {
            if (state.level === level) return;
            pauseTimer(state.level);
            state.level = level;
            for (var i = 1; i <= 4; i++) {
                document.getElementById('tab-l' + i).classList.toggle('active', i === level);
            }
            var card = document.getElementById('questionCard');
            card.classList.remove('l2', 'l3', 'l4');
            if (level > 1) card.classList.add('l' + level);
            var fill = document.getElementById('progressFill');
            fill.classList.remove('l2', 'l3', 'l4');
            if (level > 1) fill.classList.add('l' + level);
            document.getElementById('scoreLabel').textContent = 'Level ' + level + ' Score';
            document.getElementById('levelBlurb').textContent = LEVEL_BLURB[level];
            updateScore();
            updateTimeDisplay();
            nextQuestion();
        }

        /* ---------- Feedback ---------- */
        function showFeedback(type, html) {
            var box = document.getElementById('feedbackBox');
            box.className = 'feedback-box visible ' + type;
            box.innerHTML = html;
        }

        function hideFeedback() {
            var box = document.getElementById('feedbackBox');
            box.className = 'feedback-box';
            box.innerHTML = '';
        }

        function hideHint() {
            var box = document.getElementById('hintBox');
            box.classList.remove('visible');
            box.innerHTML = '';
        }

        function denFeedback(entered, q) {
            if (entered <= 0) {
                return 'You answered ' + mono(entered) + '. You need a whole number that both ' + mono(q.d1) + ' and ' + mono(q.d2) + ' go into.';
            }
            var into1 = entered % q.d1 === 0;
            var into2 = entered % q.d2 === 0;
            if (into1 && into2) {
                return 'You answered ' + mono(entered) + '. Both ' + mono(q.d1) + ' and ' + mono(q.d2) + ' do go into ' + mono(entered) + ', but there is a smaller number they both go into. Find the lowest one.';
            }
            if (!into1 && !into2) {
                return 'You answered ' + mono(entered) + '. But neither ' + mono(q.d1) + ' nor ' + mono(q.d2) + ' goes into ' + mono(entered) + '. Try counting up in ' + mono(Math.max(q.d1, q.d2)) + 's.';
            }
            var bad = into1 ? q.d2 : q.d1;
            return 'You answered ' + mono(entered) + '. But ' + mono(bad) + ' does not go into ' + mono(entered) + ', so the denominator ' + mono(bad) + ' cannot become ' + mono(entered) + 'ths.';
        }

        function numFeedback(entered, n, d, m, L) {
            if (m === 1) {
                return 'You answered ' + mono(entered) + '. The denominator ' + mono(d) + ' did not change, so the numerator ' + mono(n) + ' does not change either.';
            }
            if (entered === n) {
                return 'You answered ' + mono(entered) + ', keeping the numerator the same. But the denominator was multiplied by ' + mono(m) + '. Whatever you do to the bottom, you must do to the top.';
            }
            if (entered === n + (L - d)) {
                return 'You answered ' + mono(entered) + '. It looks like you added ' + mono(L - d) + ' because the denominator went up by ' + mono(L - d) + '. Equivalent fractions are made by multiplying, not adding. Multiply ' + mono(n) + ' by ' + mono(m) + '.';
            }
            return 'You answered ' + mono(entered) + '. The denominator ' + mono(d) + ' was multiplied by ' + mono(m) + ' to get ' + mono(L) + ', so the numerator ' + mono(n) + ' must also be multiplied by ' + mono(m) + '.';
        }

        function answerNumFeedback(entered, q) {
            var word = q.op === '+' ? 'add' : 'subtract';
            if (q.op === '+' && entered === q.n1 + q.n2 && q.n1 + q.n2 !== q.answer) {
                return 'You answered ' + mono(entered) + '. It looks like you added the original numerators ' + mono(q.n1) + ' and ' + mono(q.n2) + ', but those were different sized pieces. Use the new numerators ' + mono(q.t1) + ' and ' + mono(q.t2) + '.';
            }
            if (q.op === '-' && entered === q.n1 - q.n2 && q.n1 - q.n2 !== q.answer) {
                return 'You answered ' + mono(entered) + '. It looks like you subtracted the original numerators ' + mono(q.n1) + ' and ' + mono(q.n2) + ', but those were different sized pieces. Use the new numerators ' + mono(q.t1) + ' and ' + mono(q.t2) + '.';
            }
            if (q.op === '-' && entered === q.t2 - q.t1) {
                return 'You answered ' + mono(entered) + '. It looks like you took ' + mono(q.t1) + ' away from ' + mono(q.t2) + '. It is the other way round: ' + mono(q.t1) + ' subtract ' + mono(q.t2) + '.';
            }
            if (q.op === '+' && q.answer > q.L && entered === q.answer - q.L) {
                return 'You answered ' + mono(entered) + '. It looks like you started turning it into a mixed number. Keep it as an improper fraction: put all the pieces on top.';
            }
            return 'You answered ' + mono(entered) + '. The pieces are the same size now, so just ' + word + ' the numerators: ' + mono(q.t1) + ' ' + q.op + ' ' + mono(q.t2) + '.';
        }

        function answerDenFeedback(entered, q) {
            if (entered === q.L * 2) {
                return 'You answered ' + mono(entered) + '. It looks like you added the two denominators. The pieces stay the same size, so the denominator stays as ' + mono(q.L) + '.';
            }
            if (entered === 0) {
                return 'You answered ' + mono(entered) + '. It looks like you subtracted the two denominators. The pieces stay the same size, so the denominator stays as ' + mono(q.L) + '.';
            }
            return 'You answered ' + mono(entered) + '. Adding or subtracting fractions does not change the size of the pieces. Both fractions are ' + mono(q.L) + 'ths, so the answer is in ' + mono(q.L) + 'ths too.';
        }

        function divisorFeedback(entered, curN, curD) {
            if (entered === 1) {
                return 'You answered ' + mono(1) + '. Dividing by ' + mono(1) + ' leaves the fraction exactly as it was. You need a number bigger than ' + mono(1) + '.';
            }
            if (entered < 1) {
                return 'You answered ' + mono(entered) + '. You need a whole number bigger than ' + mono(1) + '.';
            }
            var intoN = curN % entered === 0;
            var intoD = curD % entered === 0;
            if (!intoN && !intoD) {
                return 'You answered ' + mono(entered) + '. But ' + mono(entered) + ' does not divide exactly into ' + mono(curN) + ' or ' + mono(curD) + '. It has to go into both.';
            }
            var bad = intoN ? curD : curN;
            return 'You answered ' + mono(entered) + '. It goes into ' + mono(intoN ? curN : curD) + ', but not into ' + mono(bad) + '. The number has to divide both the top and the bottom exactly.';
        }

        /* ---------- Validation ---------- */
        function readValue(input) {
            var v = input.value.trim();
            if (v === '') return null;
            var n = Number(v);
            if (isNaN(n) || !isFinite(n) || n !== Math.floor(n)) return NaN;
            return n;
        }

        function showMultChip(which) {
            if (state.level !== 1) return;
            var q = state.q;
            var chip = document.getElementById(which === 'den1' ? 'mult1' : 'mult2');
            chip.textContent = '×' + (which === 'den1' ? q.m1 : q.m2);
            chip.classList.add('visible');
        }

        function checkBox(which) {
            if (which.indexOf('simp:') === 0) return checkSimplifyBox(which);
            var q = state.q;
            var input = inputs[which];
            if (!input || input.disabled || input.readOnly) return;
            var entered = readValue(input);
            if (entered === null) return;
            if (isNaN(entered)) {
                markWrong(input, 'Your answer needs to be a whole number.');
                return;
            }

            var correct, feedbackHtml;
            if (which === 'den1' || which === 'den2') {
                correct = (entered === q.L);
                feedbackHtml = denFeedback(entered, q);
            } else if (which === 'num1') {
                correct = (entered === q.t1);
                feedbackHtml = numFeedback(entered, q.n1, q.d1, q.m1, q.L);
            } else if (which === 'num2') {
                correct = (entered === q.t2);
                feedbackHtml = numFeedback(entered, q.n2, q.d2, q.m2, q.L);
            } else if (which === 'sumNum') {
                correct = (entered === q.answer);
                feedbackHtml = answerNumFeedback(entered, q);
            } else {
                correct = (entered === q.L);
                feedbackHtml = answerDenFeedback(entered, q);
            }

            if (correct) {
                markCorrect(input);
                if (which === 'den1' || which === 'den2') showMultChip(which);
                advanceFlow();
            } else {
                markWrong(input, feedbackHtml);
            }
        }

        function checkSimplifyBox(key) {
            var parts = key.split(':');
            var part = parts[1], i = parseInt(parts[2], 10);
            var input = document.getElementById('simp-' + part + '-' + i);
            if (!input || input.disabled || input.readOnly) return;
            var entered = readValue(input);
            if (entered === null) return;
            if (isNaN(entered)) {
                markWrong(input, 'Your answer needs to be a whole number.');
                return;
            }

            var s = state.simp;
            var divisorInput = document.getElementById('simp-div-' + i);

            if (part === 'div') {
                var valid = entered > 1 && s.curN % entered === 0 && s.curD % entered === 0;
                if (!valid) {
                    markWrong(input, divisorFeedback(entered, s.curN, s.curD));
                    return;
                }
                markCorrect(input);
                document.getElementById('simp-num-' + i).disabled = false;
                document.getElementById('simp-den-' + i).disabled = false;
                document.getElementById('simp-num-' + i).focus();
                showFeedback('fb-progress', 'Good, ' + mono(entered) + ' goes into both. Now divide the top and the bottom by ' + mono(entered) + '.');
                return;
            }

            var divisor = parseInt(divisorInput.value, 10);
            var target = (part === 'num') ? s.curN / divisor : s.curD / divisor;
            if (entered !== target) {
                var orig = (part === 'num') ? s.curN : s.curD;
                markWrong(input, 'You answered ' + mono(entered) + '. ' + mono(orig) + ' divided by ' + mono(divisor) + ' is ' + mono(target) + '.');
                return;
            }
            markCorrect(input);

            var numDone = document.getElementById('simp-num-' + i).classList.contains('correct');
            var denDone = document.getElementById('simp-den-' + i).classList.contains('correct');
            if (!(numDone && denDone)) {
                var other = (part === 'num') ? 'den' : 'num';
                document.getElementById('simp-' + other + '-' + i).focus();
                return;
            }

            /* Both parts of this step are done. Move on or finish. */
            s.curN = s.curN / divisor;
            s.curD = s.curD / divisor;
            s.stepCount++;

            if (gcd(s.curN, s.curD) === 1) {
                simplifyComplete();
            } else {
                showFeedback('fb-partial',
                    'Correct, but ' + mono(s.curN + '/' + s.curD) + ' is not as simple as it can be. There is still a number that goes into both. Keep dividing.');
                hideHint();
                addSimplifyStep();
            }
        }

        function markCorrect(input) {
            input.classList.remove('wrong');
            input.classList.add('correct');
            input.readOnly = true;
            hideFeedback();
        }

        function markWrong(input, html) {
            input.classList.remove('correct');
            input.classList.add('wrong');
            showFeedback('fb-wrong', html);
        }

        function isDone(key) { return inputs[key].classList.contains('correct'); }

        function advanceFlow() {
            var q = state.q;
            var densDone = isDone('den1') && isDone('den2');
            var numsDone = isDone('num1') && isDone('num2');
            var answerDone = isDone('sumNum') && isDone('sumDen');

            if (densDone && inputs.num1.disabled) {
                inputs.num1.disabled = false;
                inputs.num2.disabled = false;
                document.getElementById('instruction').innerHTML = 'Both denominators are ' + mono(q.L) + '. Now convert the numerators.';
                var msg = 'Both fractions are becoming ' + mono(q.L) + 'ths. Now work out the new numerators.';
                if (state.level === 1) msg = 'Both fractions are becoming ' + mono(q.L) + 'ths. The ' + mono('×') + ' clues show what happened to each denominator.';
                showFeedback('fb-progress', msg);
                hideHint();
                inputs.num1.focus();
                return;
            }

            if (densDone && numsDone && state.level === 3 && inputs.sumNum.disabled) {
                inputs.sumNum.disabled = false;
                inputs.sumDen.disabled = false;
                var word = q.op === '+' ? 'Add' : 'Subtract';
                document.getElementById('instruction').textContent = 'The denominators match. Now ' + word.toLowerCase() + ' the two fractions.';
                showFeedback('fb-progress', 'Converted. Now work out ' + mono(q.t1 + '/' + q.L) + ' ' + q.op + ' ' + mono(q.t2 + '/' + q.L) + '.');
                hideHint();
                inputs.sumNum.focus();
                return;
            }

            if (densDone && numsDone && (state.level !== 3 || answerDone)) {
                convertComplete();
                return;
            }

            var order = ['den1', 'den2', 'num1', 'num2', 'sumNum', 'sumDen'];
            for (var i = 0; i < order.length; i++) {
                var inp = inputs[order[i]];
                if (!inp.disabled && !inp.readOnly) { inp.focus(); return; }
            }
        }

        /* ---------- Completion ---------- */
        function convertComplete() {
            var q = state.q;
            var html = 'Correct! ' + mono(q.n1 + '/' + q.d1) + ' = ' + mono(q.t1 + '/' + q.L) +
                ' and ' + mono(q.n2 + '/' + q.d2) + ' = ' + mono(q.t2 + '/' + q.L);
            if (state.level === 3) {
                html += ', and ' + mono(q.t1 + '/' + q.L) + ' ' + q.op + ' ' + mono(q.t2 + '/' + q.L) + ' = ' + mono(q.answer + '/' + q.L);
            }
            html += '. That is 1 point.';
            finishQuestion(html);
        }

        function simplifyComplete() {
            var q = state.q, s = state.simp;
            var html = 'Correct! ' + mono(q.n0 + '/' + q.d0) + ' in its simplest form is ' + mono(s.curN + '/' + s.curD) + '.';
            if (s.stepCount > 1) {
                html += ' You got there in ' + mono(s.stepCount) + ' steps. Dividing by ' + mono(q.hcf) + ' straight away would have done it in one.';
            } else {
                html += ' You found the biggest divisor first time, in one step.';
            }
            html += ' That is 1 point.';
            finishQuestion(html);
        }

        function finishQuestion(html) {
            state.scores[state.level]++;
            updateScore();
            showFeedback('fb-success', html);
            document.getElementById('instruction').textContent = 'Nice work. Press Enter or click Next question.';
            document.getElementById('nextBtn').classList.add('visible');
            hideHint();

            var score = state.scores[state.level];
            var t = state.timing[state.level];
            for (var i = 0; i < MILESTONES.length; i++) {
                var m = MILESTONES[i];
                if (score === m && !t.splits[m]) {
                    t.splits[m] = elapsedMs(state.level);
                    if (m === state.goal) {
                        state.goalReached[state.level] = true;
                        pauseTimer(state.level);
                    }
                    showMilestoneOverlay(m, t.splits[m]);
                    break;
                }
            }
        }

        function nextTarget(score) {
            for (var i = 0; i < MILESTONES.length; i++) {
                if (score < MILESTONES[i]) return MILESTONES[i];
            }
            return state.goal;
        }

        function updateScore() {
            var score = state.scores[state.level];
            document.getElementById('scoreCount').textContent = score;
            document.getElementById('scoreTarget').textContent = nextTarget(score);
            document.getElementById('progressFill').style.width = Math.min(100, (score / state.goal) * 100) + '%';
            document.getElementById('goalMsg').style.display = score >= state.goal ? 'inline' : 'none';
        }

        var NEXT_LEVEL_LABEL = { 1:'Try Level 2', 2:'Try Level 3', 3:'Try Level 4' };

        function showMilestoneOverlay(milestone, splitMs) {
            var title = document.getElementById('goalTitle');
            var text = document.getElementById('goalText');
            var buttons = document.getElementById('goalButtons');
            var time = formatTime(splitMs);

            if (milestone === 20) {
                title.textContent = 'First target reached!';
                text.innerHTML = mono(20) + ' correct in ' + mono(time) + '. The timer is still running. Next stop: ' + mono(35) + '.';
                buttons.innerHTML = '<button onclick="closeGoalOverlay(0)">Keep going</button>';
            } else if (milestone === 35) {
                title.textContent = 'Second target reached!';
                text.innerHTML = mono(35) + ' correct in ' + mono(time) + '. One final push to ' + mono(50) + '.';
                buttons.innerHTML = '<button onclick="closeGoalOverlay(0)">Keep going</button>';
            } else {
                title.textContent = '50 correct. You did it!';
                text.innerHTML = 'Level ' + state.level + ' finished in ' + mono(time) + '.';
                if (state.level < 4) {
                    buttons.innerHTML = '<button onclick="closeGoalOverlay(' + (state.level + 1) + ')">' + NEXT_LEVEL_LABEL[state.level] + '</button>' +
                        '<button onclick="closeGoalOverlay(0)" style="background:#636E72;">Keep practising</button>';
                } else {
                    text.innerHTML += ' That is every level done. Serious fraction power.';
                    buttons.innerHTML = '<button onclick="closeGoalOverlay(0)">Keep practising</button>';
                }
            }
            document.getElementById('goalOverlay').classList.add('visible');
        }

        function closeGoalOverlay(switchTo) {
            document.getElementById('goalOverlay').classList.remove('visible');
            if (switchTo) setLevel(switchTo);
        }

        /* ---------- Hints ---------- */
        function multiplesList(d, L) {
            var out = [];
            for (var m = d; m <= L; m += d) out.push(m);
            return out.map(mono).join(', ');
        }

        function commonFactors(a, b) {
            return factorsOf(a).filter(function (f) { return b % f === 0; });
        }

        function showHint() {
            var box = document.getElementById('hintBox');
            box.innerHTML = (state.q.kind === 'simplify') ? simplifyHint() : convertHint();
            box.classList.add('visible');
        }

        function simplifyHint() {
            var s = state.simp;
            var common = commonFactors(s.curN, s.curD);
            var usable = common.filter(function (f) { return f > 1; });
            return '<strong>Which number divides both?</strong><br>' +
                'Factors of ' + mono(s.curN) + ': ' + factorsOf(s.curN).map(mono).join(', ') + '<br>' +
                'Factors of ' + mono(s.curD) + ': ' + factorsOf(s.curD).map(mono).join(', ') + '<br>' +
                'In both lists: ' + usable.map(mono).join(', ') + '.<br>' +
                'Any of these will work, but the biggest one gets you to the simplest form fastest.';
        }

        function convertHint() {
            var q = state.q;
            var densDone = isDone('den1') && isDone('den2');
            var numsDone = isDone('num1') && isDone('num2');
            if (!densDone) {
                return '<strong>Finding the denominator:</strong> you need the smallest number in both times tables.<br>' +
                    'Multiples of ' + mono(q.d1) + ': ' + multiplesList(q.d1, q.L) + '<br>' +
                    'Multiples of ' + mono(q.d2) + ': ' + multiplesList(q.d2, q.L) + '<br>' +
                    'The smallest number in both lists is your denominator.';
            }
            if (!numsDone) {
                var h1 = (q.m1 === 1)
                    ? mono(q.n1 + '/' + q.d1) + ' is already in ' + mono(q.L) + 'ths, so it does not change.'
                    : 'For ' + mono(q.n1 + '/' + q.d1) + ': you multiplied ' + mono(q.d1) + ' by ' + mono(q.m1) + ' to get ' + mono(q.L) + ', so multiply ' + mono(q.n1) + ' by ' + mono(q.m1) + ' as well.';
                var h2 = (q.m2 === 1)
                    ? mono(q.n2 + '/' + q.d2) + ' is already in ' + mono(q.L) + 'ths, so it does not change.'
                    : 'For ' + mono(q.n2 + '/' + q.d2) + ': you multiplied ' + mono(q.d2) + ' by ' + mono(q.m2) + ' to get ' + mono(q.L) + ', so multiply ' + mono(q.n2) + ' by ' + mono(q.m2) + ' as well.';
                return '<strong>Converting the numerators:</strong> whatever you do to the bottom, do to the top.<br>' + h1 + '<br>' + h2;
            }
            var word = q.op === '+' ? 'Add' : 'Subtract';
            return '<strong>' + word + 'ing the fractions:</strong> the pieces are all ' + mono(q.L) + 'ths now, so they are the same size.<br>' +
                word + ' the numerators: ' + mono(q.t1) + ' ' + q.op + ' ' + mono(q.t2) + '.<br>' +
                'The denominator stays the same, because the size of the pieces has not changed.';
        }

        /* ---------- Events ---------- */
        function attachInput(input, key) {
            input.addEventListener('blur', function () { checkBox(key); });
            input.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (document.getElementById('nextBtn').classList.contains('visible')) nextQuestion();
                    else checkBox(key);
                }
            });
            input.addEventListener('input', function () {
                startTimerIfNeeded();
                if (input.classList.contains('wrong')) {
                    input.classList.remove('wrong');
                    hideFeedback();
                }
            });
        }

        Object.keys(inputs).forEach(function (key) { attachInput(inputs[key], key); });

        document.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && document.getElementById('nextBtn').classList.contains('visible') &&
                document.activeElement.tagName !== 'INPUT') {
                nextQuestion();
            }
        });

        /* ---------- Start ---------- */
        document.getElementById('levelBlurb').textContent = LEVEL_BLURB[1];
        state.q = makeQuestion();
        renderQuestion();
        updateScore();
    </script>

</body>
</html>
